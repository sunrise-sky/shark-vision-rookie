<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">CNN 图像分类流程</title>
  <desc id="desc">猫的输入图像经过 CNN 提取特征，输出图像类别。仅为流程示意，不代表实际预测结果。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#089dc7"/></marker>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 H 0 V 24" fill="none" stroke="#97d9eb" stroke-width="2"/></pattern>
  </defs>
  <rect width="1200" height="600" rx="24" fill="#fbfdff"/>
  <g font-family="sans-serif" text-anchor="middle" fill="#10365c">
    <text x="600" y="70" font-size="32" font-weight="700">CNN 图像分类</text>
    <rect x="55" y="155" width="260" height="280" rx="18" fill="white" stroke="#10365c" stroke-width="3"/>
    <text x="185" y="200" font-size="24">输入图像</text>
    <rect x="85" y="225" width="200" height="175" rx="12" fill="#e2f5fc"/>
    <path d="M 130 300 L 123 252 L 160 275 Q 185 264 210 275 L 247 252 L 240 300 Q 255 365 185 377 Q 115 365 130 300 Z" fill="#91c9df" stroke="#10365c" stroke-width="3" stroke-linejoin="round"/>
    <g fill="#10365c"><ellipse cx="160" cy="319" rx="6" ry="9"/><ellipse cx="210" cy="319" rx="6" ry="9"/><path d="M 178 337 L 192 337 L 185 344 Z"/></g>
    <g fill="none" stroke="#10365c" stroke-width="2.5" stroke-linecap="round"><path d="M 185 344 V 351 Q 174 362 167 351 M 185 351 Q 196 362 203 351 M 142 338 L 111 332 M 142 349 L 110 353 M 228 338 L 259 332 M 228 349 L 260 353"/></g>
    <path d="M 335 295 H 419" fill="none" stroke="#089dc7" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="440" y="155" width="320" height="280" rx="18" fill="white" stroke="#10365c" stroke-width="3"/>
    <text x="600" y="200" font-size="24">CNN 特征提取</text>
    <g stroke="#1388b4" stroke-width="2">
      <rect x="480" y="260" width="135" height="135" rx="5" fill="#e2f5fc"/>
      <rect x="505" y="245" width="135" height="135" rx="5" fill="#c7edf8"/>
      <rect x="530" y="230" width="135" height="135" rx="5" fill="#a4deef"/>
      <rect x="530" y="230" width="135" height="135" rx="5" fill="url(#grid)"/>
    </g>
    <path d="M 554 326 L 578 278 L 602 302 L 626 254 L 650 278" fill="none" stroke="#10365c" stroke-width="5"/>
    <path d="M 780 295 H 864" fill="none" stroke="#089dc7" stroke-width="5" marker-end="url(#arrow)"/>
    <rect x="885" y="155" width="260" height="280" rx="18" fill="white" stroke="#10365c" stroke-width="3"/>
    <text x="1015" y="200" font-size="24">类别输出</text>
    <rect x="915" y="245" width="200" height="66" rx="12" fill="#d4f2fb" stroke="#089dc7" stroke-width="2"/>
    <text x="1015" y="288" font-size="32" font-weight="700">cat</text>
    <text x="1015" y="350" font-size="23" fill="#667e95">dog</text>
    <text x="1015" y="390" font-size="23" fill="#667e95">…</text>
    <text x="600" y="510" font-size="20" fill="#667e95">整张图像 → 提取特征 → 预测类别</text>
  </g>
</svg>
